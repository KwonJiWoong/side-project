<!doctype html>
<html lang="ko" data-page="select">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0e1013">
  <title>핏루틴 - 일반용·노약자용 운동 루틴 플래너</title>
  <meta name="description" content="근력 운동 루틴과 어르신을 위한 의자 운동·스트레칭·균형 운동을 타이머와 기록으로 관리하는 운동 플래너입니다.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script src="js/mode.js"></script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <!-- 아이콘 모음 -->
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5V6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 5.5v13l9-6.5zM18 5.5v13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9M4.5 4.5V9H9" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 16.9v.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M5.5 14.5 12 8l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M5.5 9.5 12 16l6.5-6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.8 3.2 5.5 5.3 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.6 1.4-4.3 2.6-5.3.2 2 1.2 3.1 2.4 3.3-.4-3.1.1-5.8.5-8.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.5 19.5h4l10-10-4-4-10 10zM13 7l4 4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4.5 3.5 8 7 11.5M3.5 8h13M17 12.5l3.5 3.5-3.5 3.5M20.5 16h-13" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-font" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M8.5 19h7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tip" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 11v5.5M12 7.5v.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-chair" viewBox="0 0 24 24"><path d="M7 3.5v9h10v-9M7 12.5v8M17 12.5v8M5.5 12.5h13" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <!-- 헤더 -->
  <header class="header">
    <div class="wrap header__inner">
      <a class="header__logo" href="routine.html"><svg class="ico header__mark" aria-hidden="true" focusable="false"><use href="#i-dumbbell"></use></svg>핏루틴</a>
      <div class="header__tools">
        <button class="btn btn--sm btn--toggle" id="font-toggle" type="button" aria-pressed="false" data-mode-only="senior"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-font"></use></svg>글자 크게<svg class="ico btn__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg></button>
        <a class="btn btn--sm" href="index.html?select=1"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-swap"></use></svg>화면 바꾸기</a>
      </div>
    </div>
  </header>

  <main class="wrap choice-page" id="main">
    <section class="page-head" aria-labelledby="page-title">
      <p class="page-head__eyebrow">Welcome</p>
      <h1 class="page-head__title" id="page-title">어떤 화면으로 운동할까요?</h1>
      <p class="page-head__desc">한 번 고르면 기억해 두고, 다음부터는 바로 운동 화면으로 이동해요. 언제든 위쪽 ‘화면 바꾸기’로 바꿀 수 있어요.</p>
    </section>

    <!-- 화면 선택 -->
    <div class="choices" role="group" aria-label="화면 종류">
      <button class="choice" type="button" data-choose-mode="general" aria-pressed="false">
        <span class="choice__top"><svg class="ico choice__ico" aria-hidden="true" focusable="false"><use href="#i-dumbbell"></use></svg><span class="choice__current">지금 사용 중</span></span>
        <span class="choice__title">일반용</span>
        <span class="choice__desc">헬스장·홈트레이닝 근력 운동 · 어두운 화면</span>
        <span class="choice__list">
          <span class="choice__item"><svg class="ico choice__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>가슴·등·하체 등 부위별 루틴 6가지</span>
          <span class="choice__item"><svg class="ico choice__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>타바타·인터벌 타이머</span>
          <span class="choice__item"><svg class="ico choice__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>주간 기록과 나만의 루틴</span>
        </span>
        <span class="choice__go">일반용으로 시작<svg class="ico" aria-hidden="true" focusable="false"><use href="#i-right"></use></svg></span>
      </button>
      <button class="choice" type="button" data-choose-mode="senior" aria-pressed="false">
        <span class="choice__top"><svg class="ico choice__ico" aria-hidden="true" focusable="false"><use href="#i-chair"></use></svg><span class="choice__current">지금 사용 중</span></span>
        <span class="choice__title">노약자용</span>
        <span class="choice__desc">무리 없는 운동 · 밝은 화면과 큰 글씨</span>
        <span class="choice__list">
          <span class="choice__item"><svg class="ico choice__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>의자 운동·스트레칭·균형 운동</span>
          <span class="choice__item"><svg class="ico choice__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>큰 글씨, 큰 버튼, 글자 크기 조절</span>
          <span class="choice__item"><svg class="ico choice__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>천천히 쉬어 가는 타이머</span>
        </span>
        <span class="choice__go">노약자용으로 시작<svg class="ico" aria-hidden="true" focusable="false"><use href="#i-right"></use></svg></span>
      </button>
    </div>
  </main>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="wrap">
      <p class="footer__text">기록과 내 루틴은 이 브라우저에만 저장돼요.</p>
      <p class="footer__copy">© 2026 핏루틴 · 웹 퍼블리싱 포트폴리오</p>
    </div>
  </footer>
</body>
</html>
