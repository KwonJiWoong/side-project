<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0e1013">
  <title>운동 타이머 | 핏루틴</title>
  <meta name="description" content="운동·휴식 시간과 세트 수를 정해 쓰는 인터벌 운동 타이머. 타바타, 근력, 인터벌 빠른 설정을 지원해요.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <!-- 아이콘 모음 -->
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5V6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9M4.5 4.5V9H9" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 16.9v.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </svg>

  <!-- 헤더 -->
  <header class="header">
    <div class="wrap header__inner">
      <a class="header__logo" href="index.html"><svg class="ico header__mark" aria-hidden="true" focusable="false"><use href="#i-dumbbell"></use></svg>핏루틴</a>
      <nav class="gnb" aria-label="주 메뉴">
        <ul class="gnb__list">
          <li><a class="gnb__link" href="index.html"><svg class="ico gnb__ico" aria-hidden="true" focusable="false"><use href="#i-list"></use></svg>루틴</a></li>
          <li><a class="gnb__link" href="timer.html" aria-current="page"><svg class="ico gnb__ico" aria-hidden="true" focusable="false"><use href="#i-timer"></use></svg>타이머</a></li>
          <li><a class="gnb__link" href="record.html"><svg class="ico gnb__ico" aria-hidden="true" focusable="false"><use href="#i-calendar"></use></svg>기록</a></li>
          <li><a class="gnb__link" href="my-routine.html"><svg class="ico gnb__ico" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>내 루틴</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <!-- 페이지 제목 -->
    <section class="page-head" aria-labelledby="page-title">
      <p class="page-head__eyebrow">Timer</p>
      <h1 class="page-head__title" id="page-title">운동 타이머</h1>
      <p class="page-head__desc">운동·휴식 시간과 세트 수를 정하고 시작하세요. 끝까지 마치면 오늘 기록에 자동으로 체크돼요.</p>
    </section>

    <div class="timer">
      <!-- 타이머 화면 -->
      <section class="panel timer__display" aria-labelledby="timer-name">
        <h2 class="timer__name" id="timer-name">자유 운동</h2>

        <div class="ring" id="ring" data-phase="ready">
          <svg class="ring__svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
            <circle class="ring__track" cx="60" cy="60" r="54" fill="none" stroke-width="7"/>
            <circle class="ring__bar" id="ring-bar" cx="60" cy="60" r="54" fill="none" stroke-width="7" stroke-linecap="round"/>
          </svg>
          <p class="ring__center">
            <span class="ring__phase" id="timer-phase">준비</span>
            <span class="ring__time" id="timer-time">00:40</span>
            <span class="ring__set" id="timer-set">1 / 4 세트</span>
          </p>
        </div>

        <ol class="timer__dots" id="timer-dots" aria-hidden="true"></ol>

        <div class="timer__controls">
          <button class="btn btn--primary timer__btn" id="timer-toggle" type="button"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-play"></use></svg><span id="timer-toggle-text">시작</span></button>
          <button class="btn timer__btn" id="timer-reset" type="button"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-reset"></use></svg>처음부터</button>
        </div>

        <button class="btn btn--sm btn--toggle" id="timer-sound" type="button" aria-pressed="true"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-sound"></use></svg>알림음<svg class="ico btn__check" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg></button>

        <p class="sr-only" id="timer-status" aria-live="polite"></p>
      </section>

      <!-- 타이머 설정 -->
      <section class="panel" aria-labelledby="timer-set-title">
        <h2 class="panel__title" id="timer-set-title">타이머 설정</h2>
        <form class="timer-form" id="timer-form" novalidate>
          <fieldset class="timer-form__set" id="timer-fieldset">
            <legend class="sr-only">운동 시간, 휴식 시간, 세트 수</legend>

            <p class="presets__title" id="preset-title">빠른 설정</p>
            <ul class="presets" aria-labelledby="preset-title">
              <li><button class="btn btn--sm presets__btn" type="button" data-preset="20,10,8">타바타 <span class="presets__value">20/10초 × 8</span></button></li>
              <li><button class="btn btn--sm presets__btn" type="button" data-preset="40,60,4">근력 <span class="presets__value">40/60초 × 4</span></button></li>
              <li><button class="btn btn--sm presets__btn" type="button" data-preset="30,15,10">인터벌 <span class="presets__value">30/15초 × 10</span></button></li>
            </ul>

            <div class="timer-form__grid">
              <div class="field field--full">
                <label class="field__label" for="timer-name-input">운동 이름 <span class="field__opt">(선택)</span></label>
                <input class="field__input" id="timer-name-input" name="name" type="text" maxlength="20" placeholder="예) 스쿼트" autocomplete="off">
              </div>
              <div class="field">
                <label class="field__label" for="timer-work">운동(초)</label>
                <input class="field__input" id="timer-work" name="work" type="number" inputmode="numeric" min="5" max="600" value="40" required aria-describedby="timer-work-error">
                <p class="field__error" id="timer-work-error" hidden><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-alert"></use></svg><span data-msg></span></p>
              </div>
              <div class="field">
                <label class="field__label" for="timer-rest">휴식(초)</label>
                <input class="field__input" id="timer-rest" name="rest" type="number" inputmode="numeric" min="0" max="600" value="60" required aria-describedby="timer-rest-error">
                <p class="field__error" id="timer-rest-error" hidden><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-alert"></use></svg><span data-msg></span></p>
              </div>
              <div class="field">
                <label class="field__label" for="timer-sets">세트</label>
                <input class="field__input" id="timer-sets" name="sets" type="number" inputmode="numeric" min="1" max="20" value="4" required aria-describedby="timer-sets-error">
                <p class="field__error" id="timer-sets-error" hidden><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-alert"></use></svg><span data-msg></span></p>
              </div>
            </div>
          </fieldset>
          <p class="field__hint timer-form__hint">값을 바꾸면 바로 적용돼요. 타이머가 도는 중에는 바꿀 수 없어요.</p>
        </form>
      </section>
    </div>
  </main>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="wrap">
      <p class="footer__text">기록과 내 루틴은 이 브라우저에만 저장돼요.</p>
      <p class="footer__copy">© 2026 핏루틴 · 웹 퍼블리싱 포트폴리오</p>
    </div>
  </footer>

  <!-- 알림창 -->
  <dialog class="alert" id="alert" aria-labelledby="alert-title" aria-describedby="alert-message">
    <form method="dialog">
      <div class="alert__head">
        <svg class="ico alert__ico" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>
        <h2 class="alert__title" id="alert-title">알림</h2>
      </div>
      <p class="alert__message" id="alert-message"></p>
      <div class="alert__actions">
        <button class="btn alert__btn" id="alert-cancel" type="submit" value="cancel" hidden>취소</button>
        <button class="btn btn--primary alert__btn" id="alert-ok" type="submit" value="ok">확인</button>
      </div>
    </form>
  </dialog>
</body>
</html>
