# 오늘의 정치 소식 - 언론사 RSS에서 기사 제목·링크를 모아 news.json 갱신
name: 정치 뉴스 모으기

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 오전 7시 (한국 시간)
    - cron: '0 3 * * *'    # 매일 정오 12시 (한국 시간)
    - cron: '0 9 * * *'    # 매일 오후 6시 (한국 시간)
  workflow_dispatch:        # Actions 화면에서 직접 실행
  push:
    paths:
      - 'projects/politics-news/scraper/**'
      - '.github/workflows/politics-news.yml'

permissions:
  contents: write

concurrency:
  group: politics-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 기사 모으기
        run: python projects/politics-news/scraper/collect.py

      - name: 바뀐 기사 올리기
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/politics-news/data/news.json
          if git diff --cached --quiet; then
            echo '바뀐 기사가 없어요.'
            exit 0
          fi
          git commit -m 'chore: 정치 뉴스 데이터 갱신'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
